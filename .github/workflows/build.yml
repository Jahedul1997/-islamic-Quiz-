name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore and Base64
        run: |
          keytool -genkey -v -keystore release.keystore -storepass IslamicQuiz2026 -alias islamicquiz -keypass IslamicQuiz2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IslamicQuiz,O=Developer,C=BD"
          base64 -w 0 release.keystore > keystore_base64.txt

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: my-release-keystore
          path: |
            release.keystore
            keystore_base64.txt
