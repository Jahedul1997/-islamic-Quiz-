name: Build Android APK and AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK and AAB
      run: |
        BUILD_GRADLE=$(find . -name "build.gradle*" -not -path "*/app/*" -print -quit)
        if [ -z "$BUILD_GRADLE" ]; then
          echo "Error: No Android project (build.gradle) found!"
          ls -la
          exit 1
        fi
        PROJECT_DIR=$(dirname "$BUILD_GRADLE")
        echo "Found Android project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        if [ ! -f "gradlew" ]; then
          echo "gradlew missing, generating wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew assembleDebug bundleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: "**/build/outputs/bundle/release/*.aab"
