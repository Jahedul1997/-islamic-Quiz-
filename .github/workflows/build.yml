name: Generate Keystore and Base64

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore and Base64
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass 123456 -keypass 123456 -dname "CN=Jahedul, OU=Dev, O=IslamicQuiz, L=Chattogram, S=Chattogram, C=BD"
          base64 -w 0 my-upload-key.jks > keystore_base64.txt

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: |
            my-upload-key.jks
            keystore_base64.txt
